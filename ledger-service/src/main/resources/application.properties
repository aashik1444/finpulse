spring.application.name=ledger-service
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/finpulse_ledger
spring.datasource.username=finpulse
spring.datasource.password=finpulse
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Write and read timestamps in UTC. A ledger must produce identical timestamps no matter
# which machine or region it runs on, so normalising to UTC at the JDBC boundary removes a
# whole class of off-by-hours bugs. The JVM is also pinned to UTC in pom.xml; see the
# comment there for why that second, separate setting is required.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.jdbc.bind=TRACE

management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=always

# audit-service location, used by the outbox poller.
audit-service.base-url=http://localhost:8081
