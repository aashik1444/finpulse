spring.application.name=audit-service
server.port=8081

# A separate DATABASE, not just a separate schema, inside the same Postgres server.
# This makes it structurally impossible for audit-service to join against or
# foreign-key into the ledger's tables: the only channel between the two services
# is the HTTP API. That is the point of building them as two services rather than
# one, and a shared schema would quietly erode it.
spring.datasource.url=jdbc:postgresql://localhost:5432/finpulse_audit
spring.datasource.username=finpulse
spring.datasource.password=finpulse
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=always
